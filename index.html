<style>
/* Layout idea: a signage-style header band, then a searchable directory or a TV/board view, grouped by floor or by colour-coded category. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#13202a; --muted:#5a6a77; --line:#dbe2e8;
  --accent:#0a6a9e; --accent-ink:#ffffff; --band:#0d2b3e; --band-ink:#ffffff;
  --c-food:#e0712c; --c-fashion:#e05aa0; --c-tech:#2d6bd3; --c-bank:#2a955a;
  --c-health:#14907f; --c-beauty:#8853c6; --c-grocery:#b98d0c; --c-home:#8a5a2b; --c-ent:#d1386b;
  --c-motor:#3d4f63; --c-office:#4f6fa8; --c-edu:#b5651d; --c-fac:#0f6e8c; --c-services:#687581; --c-other:#46525d;
  --warn:#c27c0e;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --surface-a:rgba(255,255,255,.86); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e151b; --surface:#16212a; --ink:#e6edf2; --muted:#98a9b6; --line:#283643;
    --accent:#4cade0; --accent-ink:#04202e; --band:#0a1f2d; --band-ink:#e6edf2; color-scheme:dark; --surface-a:rgba(22,33,42,.88);
  }
}
:root[data-theme="dark"]{ --surface-a:rgba(22,33,42,.88);
  --bg:#0e151b; --surface:#16212a; --ink:#e6edf2; --muted:#98a9b6; --line:#283643;
  --accent:#4cade0; --accent-ink:#04202e; --band:#0a1f2d; --band-ink:#e6edf2; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.logobar{background:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid #dbe2e8}
.logobar img{height:64px;width:auto;max-width:42vw;object-fit:contain;display:block}
.logobar .txt{font:800 18px var(--display);color:#13202a}
@media (max-width:480px){.logobar img{height:46px}}
.board-tools{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.board-tools .ghost{color:var(--ink);border-color:var(--line);background:var(--surface)}
.bh-logo{background:#fff;border-radius:12px;padding:10px 14px;height:120px;display:flex;align-items:center;justify-content:center;min-width:120px}
.bh-logo img{max-height:100px;max-width:220px;width:auto;height:auto;display:block}
.bh-title{text-align:center}
.top{background:var(--band);color:var(--band-ink);padding:14px 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-logo{width:52px;height:52px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;overflow:hidden;flex:none;font:800 20px var(--display)}
.brand-logo.wide{width:84px;background:#fff;padding:3px}
.brand-logo.wide img{width:auto;height:auto;max-width:100%;max-height:100%;display:block}
.brand-logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand h1{font-size:22px;font-weight:800;letter-spacing:.01em}
.brand p{margin:2px 0 0;opacity:.75;font-size:13px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px}
.tabs a{color:var(--band-ink);padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none}
.tabs a[aria-current="page"]{background:var(--band-ink);color:var(--band)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:14px}
.dir-head{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:16px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.6;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.board-head .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25)}
.board-head .seg button{color:var(--band-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fsec+.fsec{margin-top:26px}
.fh{display:flex;align-items:baseline;gap:10px;font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;padding-bottom:8px;margin-bottom:12px;border-bottom:3px solid var(--ink)}
.fh small{font:500 13px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.card{background:var(--surface-a);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:56px 1fr;gap:12px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cat)}
.logo{width:56px;height:56px;border-radius:9px;display:grid;place-items:center;overflow:hidden;background:var(--cat);color:#fff;font:800 18px var(--display)}
.logo img,.mini img{width:100%;height:100%;object-fit:contain;background:#fff}
.card h3{font-size:17px;font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.where{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.where span{white-space:nowrap;background:var(--bg);border:1px solid var(--line);padding:1px 8px;border-radius:6px}
.actions{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.actions a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.pill{display:inline-block;margin-bottom:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn);color:#fff;text-transform:uppercase;letter-spacing:.04em}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface-a);border:1px dashed var(--line);border-radius:var(--r)}
.qr-strip{display:flex;align-items:center;gap:16px;background:var(--surface-a);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-top:22px}
.qr-box{background:#fff;padding:12px;border-radius:6px;flex:none;line-height:0}
.hint{font-size:13px;color:var(--muted)}
.board{background:var(--surface-a);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.board-head{background:var(--band);color:var(--band-ink);padding:22px 26px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px}
@media (max-width:640px){.board-head{grid-template-columns:1fr 1fr}.bh-title{grid-column:1/-1;order:3}.bh-logo{height:84px;min-width:0}.bh-logo img{max-height:64px;max-width:100%}}
.board-head h2{font-size:34px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.board-head p{margin:4px 0 0;opacity:.8;font-size:15px}
.board-cols{display:grid}
.bcol{border-top:1px solid var(--line);border-right:1px solid var(--line)}
.bcol:last-child{border-right:0}
.bcat{padding:18px 22px}
.bcat+.bcat{border-top:1px solid var(--line)}
.bcat h3 small{font:600 12px var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.bcat h3{display:flex;align-items:center;gap:10px;font-size:18px;text-transform:uppercase;letter-spacing:.04em;padding-bottom:8px;margin-bottom:6px;border-bottom:3px solid var(--cat)}
.bcat h3 i{width:14px;height:14px;border-radius:4px;background:var(--cat)}
.brow{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:17px}
.mini{width:30px;height:30px;border-radius:6px;overflow:hidden;background:var(--cat);display:grid;place-items:center;color:#fff;font:800 12px var(--display)}
.brow b{font-weight:600}
.brow em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding:12px 26px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.board-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 26px;border-top:1px solid var(--line);flex-wrap:wrap}
.board-foot .scan{display:flex;align-items:center;gap:14px}
.board-foot strong{font:800 20px var(--display)}
.ghost{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--band-ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.board.wm-board{color:#13202a}
.board:fullscreen{overflow:auto;border-radius:0}
.board:fullscreen .brow{font-size:22px}
.logobar,.top{position:relative;z-index:2}
main{position:relative;z-index:1}
.wm{position:fixed;left:0;right:0;bottom:0;top:0;z-index:0;pointer-events:none;background:center 60%/min(72vw,720px) no-repeat;opacity:.09;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wm{filter:invert(1);mix-blend-mode:screen;opacity:.06}}
:root[data-theme="dark"] .wm{filter:invert(1);mix-blend-mode:screen;opacity:.06}
.site-foot{background:var(--band);color:var(--band-ink);margin-top:10px}
.site-foot .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
.site-foot h2{font-size:14px;font-weight:700;margin:0 0 4px;opacity:.8}
.site-foot .contacts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:15px}
.site-foot a{color:var(--band-ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.site-foot a:hover{text-decoration:underline}
.site-foot svg{flex:none;opacity:.85}
.site-foot small{display:block;opacity:.7;font-size:12px}
.sticky-top{position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.site-foot{position:sticky;bottom:0;z-index:5;box-shadow:0 -2px 10px rgba(0,0,0,.12)}
.site-foot .status{max-width:1180px;margin:0 auto;padding:0 16px 8px;font-size:11px;opacity:.65}
.site-foot .status:empty{display:none}
@media (max-width:600px){
  .logobar{padding:6px 12px}.logobar img{height:36px}
  .top{padding:8px 12px;gap:8px}.brand h1{font-size:17px}.brand p{display:none}
  .tabs a{padding:5px 12px;font-size:13px}
  .site-foot .in{padding:8px 12px;gap:4px 14px}.site-foot h2{display:none}
  .site-foot .contacts{font-size:13px;gap:4px 14px}.site-foot small{display:none}
}

/* one-row header: company logo | name + view buttons | mall logo */
.hdr{background:#fff;color:#13202a;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:8px 20px;border-bottom:4px solid var(--band)}
.hdr img{height:64px;width:auto;max-width:22vw;object-fit:contain;display:block}
.hdr .txt{font:800 18px var(--display);color:#13202a}
.hdr .mid{display:flex;align-items:center;justify-content:center;gap:12px 32px;flex-wrap:wrap;min-width:0}
.hdr .brand{text-align:center}
.hdr .brand h1{font-size:24px;color:#0d2b3e}
.hdr .brand p{color:#5a6a77;opacity:1;font-size:13px}
.hdr .tabs{background:#e8edf2}
.hdr .tabs a{color:#0d2b3e}
.hdr .tabs a[aria-current="page"]{background:#0d2b3e;color:#fff}
/* one-line footer */
.site-foot .in{padding:9px 16px;gap:6px 24px}
.site-foot .contacts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;font-size:14px}
.site-foot .lbl{font-weight:700;opacity:.8}
.site-foot .in{flex-wrap:nowrap}
.site-foot .contacts{flex:none}
.site-foot .meta-r{display:flex;flex-wrap:nowrap;gap:4px 14px;font-size:12px;opacity:.7;margin-left:auto;min-width:0;justify-content:flex-end;white-space:nowrap}
.site-foot .meta-r>*{overflow:hidden;text-overflow:ellipsis}
#footBrand{flex:none}
@media (max-width:1100px){.site-foot .in{flex-wrap:wrap}.site-foot .contacts{flex:1 1 100%}.site-foot .meta-r{margin-left:0}}
.site-foot .status{padding:0;opacity:1;font-size:12px;max-width:none;margin:0}
@media (max-width:600px){
  .hdr{gap:8px;padding:6px 10px}.hdr img{height:36px}
  .hdr .mid{flex-direction:column;gap:4px}.hdr .brand h1{font-size:16px}.hdr .brand p{display:none}
  .hdr .tabs a{padding:4px 10px;font-size:12px}
  .site-foot .in{padding:6px 12px}.site-foot .lbl,.site-foot .meta-r{display:none}
  .site-foot .contacts{font-size:13px;gap:4px 14px}
}

/* open now / facilities / search */
:root{--open:#1f9d55}
.oc{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.oc.is-open{background:#e3f5ea;color:#17703e}
.oc.is-closed{background:#eceff2;color:#5a6a77}
.openchip[aria-pressed="true"]{background:var(--open);border-color:var(--open);color:#fff}
.facs{background:var(--surface-a);border:1px solid var(--line);border-left:4px solid var(--c-fac);border-radius:var(--r);padding:12px 16px;margin:0 0 20px}
.facs h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;color:var(--c-fac)}
.faclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 18px}
.fac{display:flex;flex-direction:column;font-size:13px;line-height:1.35}
.fac b{font-size:14px}
.fac span{color:var(--muted)}

/* while typing a search, hide the filters so results show straight away */
body.searching .chips, body.searching #floorf, body.searching .dir-head .seg{display:none}
/* phones: filters take less room */
@media (max-width:600px){
  .dir-head{gap:8px}
  .search{flex:1 1 100%}
  #floorf{flex:1 1 0;min-width:0;padding:8px 10px}
  .dir-head .seg button{padding:6px 10px;font-size:12px}
  .chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px 2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
}

/* staff edit button (hidden for the public) */
.staffbox{display:inline-flex;align-items:center;gap:6px}
.staffbox[hidden]{display:none}
.editbtn{background:#c27c0e;color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;white-space:nowrap}
.editbtn:hover{background:#a8690a}
.staffexit{border:0;background:none;color:#5a6a77;font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
@media (max-width:600px){.editbtn{font-size:12px;padding:5px 10px}}

.pinwrap{position:fixed;inset:0;z-index:50;background:rgba(10,20,30,.55);display:grid;place-items:center;padding:16px}
.pinwrap[hidden]{display:none}
.pincard{background:#fff;color:#13202a;border-radius:14px;padding:22px;width:min(320px,100%);display:grid;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.pincard h2{font-size:18px;margin:0}
.pincard label{font-size:13px;font-weight:600}
.pincard input{font-size:22px;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid #cfd8df;border-radius:8px}
.pinerr{color:#c43c3c;font-size:13px;margin:0;min-height:1em}
.pinbtns{display:flex;gap:8px;justify-content:flex-end}
.pinok{background:#0d2b3e;color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.pincancel{background:none;border:1px solid #cfd8df;border-radius:8px;padding:9px 14px;cursor:pointer}

.upl{margin-top:8px;border:1px dashed #c27c0e;background:#fff8ec;color:#8a5a08;font-weight:700;font-size:12px;border-radius:8px;padding:5px 10px;cursor:pointer}
.upl:disabled{opacity:.6;cursor:progress}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:60;background:#13202a;color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}#toast.bad{background:#c43c3c}

.sheetlink{color:#5a6a77;font-size:12px;text-decoration:underline}
.edcard{background:#fff;color:#13202a;border-radius:14px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.edcard h2{font-size:18px;margin:0 0 12px}
.edgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.edgrid label{display:grid;gap:4px;font-size:12px;font-weight:600;color:#3d4f63}
.edgrid .full{grid-column:1/-1}
.edgrid input,.edgrid select{font:inherit;font-size:15px;font-weight:400;color:#13202a;padding:9px 10px;border:1px solid #cfd8df;border-radius:8px;background:#fff;width:100%}
.edlogo{display:flex;align-items:center;gap:12px;border:1px dashed #cfd8df;border-radius:10px;padding:10px}
.edprev .logo{width:56px;height:56px}
.edprev:empty::before{content:"No logo";display:grid;place-items:center;width:56px;height:56px;border-radius:9px;background:#eef2f5;color:#8a99a6;font-size:11px}
.edlogobtns{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.edfile{background:#0d2b3e;color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}

function parseCSV(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];

function matchCat(v){v=String(v||"").toLowerCase().trim();if(!v)return"Other";if(/facilit|amenit/.test(v))return"Facilities";

function matchFloor(v){v=String(v||"").toLowerCase().trim();if(!v)return"Ground Floor";
  if(/mezz/.test(v))return"Mezzanine Floor";if(/out/.test(v))return"Outdoor";
  if(/^(g|gf|ground)/.test(v))return"Ground Floor";if(/^(b|basement|lower)/.test(v))return"Basement";

function toTenants(text){
  const rows=parseCSV(text);if(!rows.length)return[];
  /* Google sometimes merges the first shop row into the headings ("name Khushi Motors").
     Split it back out so that shop isn't lost. */
  const LABELS=["name","category","about","floor","shop","phone","hours","status","logo","keywords"];
  let rescued=null;
  rows[0]=rows[0].map((h,i)=>{const raw=String(h||"").trim();const m=raw.match(/^(\S+)\s+([\s\S]+)$/);
    if(m&&LABELS.includes(m[1].toLowerCase())){(rescued=rescued||rows[0].map(()=>""))[i]=m[2];return m[1]}return raw});
  if(rescued&&rescued.some(v=>v.trim()))rows.splice(1,0,rescued);
  if(rows.length<2)return[];
  const head=rows[0].map(h=>h.toLowerCase().trim());
  const col=(...n)=>head.findIndex(h=>n.some(x=>h===x));
  const col2=(...n)=>{const e=col(...n);return e>=0?e:head.findIndex(h=>n.some(x=>h.includes(x)))};
  const ix={name:col2("name","trading name","shop name","tenant"),category:col2("category"),about:col2("about","nature","description"),floor:col2("floor","level"),
    shop:col("shop","shop no","shop number","unit"),phone:col2("phone","whatsapp"),hours:col2("hours"),status:col2("status"),logo:col2("logo"),keywords:col2("keywords","tags","search")};
  return rows.slice(1).map(r=>{const g=k=>ix[k]>=0?fixText(r[ix[k]]).trim():"";
    return{name:g("name"),category:matchCat(g("category")),about:g("about"),floor:matchFloor(g("floor")),shop:g("shop"),phone:fixPhone(g("phone")),hours:g("hours"),status:matchStatus(g("status")),logo:imgUrl(g("logo")),keywords:g("keywords"),raw:{name:g("name"),floor:g("floor"),shop:g("shop")}}})
    .filter(t=>t.name).map((t,i)=>(t.i=i,t));
}
async function load(){

    try{const sep=CONFIG.sheetCsvUrl.includes("?")?"&":"?";
      const r=await fetch(CONFIG.sheetCsvUrl+sep+"t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
      const list=toTenants(await r.text());if(!list.length)throw 0;
      S.tenants=list;S.error="";S.fallback=false;S.updated=new Date();S.loaded=true;return}
    catch(e){S.error=S.tenants.length?"Couldn't refresh the shop list just now. Showing the last version.":"";if(S.tenants.length){S.loaded=true;return}}
  }
  S.tenants=toTenants(FALLBACK_CSV);S.updated=null;S.loaded=true;S.fallback=!!CONFIG.sheetCsvUrl;
}

/* ---- opening hours: "8am - 9pm", "08:00-21:00", "24 hours", "Closed" ---- */
function parseHours(h){h=String(h||"").toLowerCase().replace(/\s+/g," ").trim();if(!h)return null;
  if(/24 ?(hours|hrs|h\b)|24\/7|always open/.test(h))return{always:true};
  if(/^closed/.test(h))return{closed:true};
  const m=h.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?\s*(?:-|–|—|to)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a\.m\.|p\.m\.)?/);
  if(!m)return null;
  const mins=(hh,mm,ap)=>{hh=+hh;mm=+(mm||0);ap=(ap||"").replace(/\./g,"");if(ap==="pm"&&hh<12)hh+=12;if(ap==="am"&&hh===12)hh=0;return hh*60+mm};
  let o=mins(m[1],m[2],m[3]),c=mins(m[4],m[5],m[6]);
  if(!m[3]&&!m[6]&&c<=o&&+m[4]<=12)c+=12*60;          // "8-6" means 8am to 6pm
  if(!m[3]&&m[6]==="pm"&&o>=c)o-=12*60;               // "8-9pm"
  if(c===0)c=24*60;
  return{o,c};}
/* Day-aware hours: "8am-9pm, Thursday closed", "Mon-Fri 8am-6pm; Sat 9am-2pm; Sun closed", "Closed on Sundays" */
const DAYRX=/\b(mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)s?\b/g;
const DAYIDX={mon:1,tue:2,wed:3,thu:4,fri:5,sat:6,sun:0};
function daysIn(seg){seg=seg.toLowerCase();const out=new Set();
  if(/weekdays?/.test(seg))[1,2,3,4,5].forEach(d=>out.add(d));
  if(/weekends?/.test(seg))[0,6].forEach(d=>out.add(d));
  if(/(daily|every ?day|all week|mon(day)?\s*(-|–|to)\s*sun(day)?)/.test(seg))[0,1,2,3,4,5,6].forEach(d=>out.add(d));
  const found=[...seg.matchAll(DAYRX)].map(m=>({d:DAYIDX[m[1].slice(0,3)],at:m.index,end:m.index+m[0].length}));
  for(let k=0;k<found.length;k++){const a=found[k],b=found[k+1];
    if(b&&/^\s*(-|–|—|to)\s*$/.test(seg.slice(a.end,b.at))){let d=a.d;out.add(d);while(d!==b.d){d=(d+1)%7;out.add(d)}k++}
    else out.add(a.d)}
  return out}
function schedule(h){h=String(h||"").trim();if(!h)return null;
  const sch={def:null,day:{}};let any=false;
  h.split(/[,;\/\n]|\band\b/i).map(x=>x.trim()).filter(Boolean).forEach(seg=>{
    const days=daysIn(seg),closed=/closed|off\b/i.test(seg),rng=parseHours(seg.replace(DAYRX," "));
    if(closed&&days.size){days.forEach(d=>sch.day[d]="closed");if(rng&&!sch.def)sch.def=rng;any=true}
    else if(rng&&days.size){days.forEach(d=>sch.day[d]=rng);any=true}
    else if(rng){sch.def=rng;any=true}
    else if(closed&&!days.size){sch.def={closed:true};any=true}});
  return any?sch:null}
function openInfo(h,now=new Date()){const sch=schedule(h);if(!sch)return null;
  const today=sch.day[now.getDay()]!==undefined?sch.day[now.getDay()]:sch.def;
  if(today==="closed")return{open:false,label:"Closed today"};
  if(!today)return Object.keys(sch.day).length&&!sch.def?{open:false,label:"Closed today"}:null;
  if(today.always)return{open:true,label:"Open 24 hours"};if(today.closed)return{open:false,label:"Closed"};
  const x=now.getHours()*60+now.getMinutes(),p=today,o=p.o<=p.c?(x>=p.o&&x<p.c):(x>=p.o||x<p.c);
  return{open:o,label:o?"Open now":"Closed now"}}
function openState(h,now=new Date()){const i=openInfo(h,now);return i?i.open:null}

  insurance:["insurance","assurance"],lawyer:["advocates","law firm"],wakili:["advocates","law firm"],
  groceries:["supermarket","hypermarket","grocery"],supermarket:["supermarket","hypermarket"],

function matches(t,q){
  if(!q)return true;
  const hay=[t.name,t.category,t.about,t.shop,t.floor,t.keywords].join(" ").toLowerCase();
  if(hay.includes(q))return true;
  const alts=SYNONYMS[q]||Object.keys(SYNONYMS).filter(k=>(k.length>3&&q.startsWith(k))||(q.length>=3&&k.startsWith(q))).flatMap(k=>SYNONYMS[k]);
  return alts.some(a=>hay.includes(a));
}

      <div>${t.status==="Coming Soon"?`<span class="pill">Coming soon</span>`:""}${t.status==="Vacant"?`<span class="pill vac">Vacant – hidden from public</span>`:""}<h3>${esc(t.name)}</h3><div class="meta">${esc(t.about||c.k)}${t.hours?" · "+esc(t.hours):""}</div>${(()=>{const o=openInfo(t.hours);return !o?"":`<span class="oc ${o.open?"is-open":"is-closed"}">${o.label}</span>`})()}
      <div class="where">${t.floor?`<span>${esc(t.floor)}</span>`:""}${t.shop?`<span>${/\d/.test(t.shop)?"Shop ":""}${esc(t.shop)}</span>`:""}</div>
      ${t.phone?`<div class="actions"><a href="tel:${esc(t.phone.replace(/\s/g,""))}">Call ${esc(t.phone)}</a>${wa?`<a href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""}</div>`:""}${S.staff&&CONFIG.uploadUrl?`<button type="button" class="upl" data-i="${t.i}">✏️ Edit</button>`:""}</div></article>`};
  grid.innerHTML=!list.length?`<div class="empty">${S.tenants.length?(S.openOnly?"No shops are open right now that match your search.":"No shops match your search."):"No shops listed yet."}</div>`:
    S.group==="floor"?floorGroups(list).map(g=>`<section class="fsec"><h2 class="fh">${esc(g.f)}<small>${g.items.length} ${g.items.length===1?"shop":"shops"}</small></h2><div class="grid">${g.items.map(card).join("")}</div></section>`).join(""):
    `<div class="grid">${list.map(card).join("")}</div>`;
  grid.querySelectorAll(".upl").forEach(b=>b.addEventListener("click",()=>{const t=S.tenants[+b.dataset.i];if(t)openEditor(t)}));
}
/* Spread floor/category sections evenly over the board's columns; a long section continues in the next column. */
function packCols(groups,n){
  const H=2,total=groups.reduce((s,g)=>s+g.items.length+H,0),target=Math.ceil(total/n);
  const cols=[[]];let used=0;
  for(const g of groups){
    let items=g.items.slice(),first=true;
    while(items.length){
      const need=items.length+H,left=target-used;
      // keep a section whole: if it doesn't fit here but fits a fresh column, start the next column
      if(cols.length<n&&used>0&&(need>left+3)&&(need<=target+3||left-H<3)){cols.push([]);used=0}
      const room=(cols.length<n&&items.length+H<=target-used+3)?items.length:target-used-H;
      const take=cols.length>=n?items.length:Math.max(1,Math.min(items.length,room));
      cols[cols.length-1].push({...g,items:items.slice(0,take),cont:!first});
      used+=take+H;items=items.slice(take);first=false;
      if(items.length&&cols.length<n){cols.push([]);used=0}
    }
  }
  return cols.filter(c=>c.length);
}
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(S.view==="board")fillBoard()},200)});
function fillBoard(){
  const b=$("#board");if(!b)return;const all=visible();const facs=facilities().sort(byFloor);
  const groups=S.group==="floor"
    ?floorGroups(all).map(g=>({title:g.f,color:"var(--ink)",items:g.items,tag:t=>t.shop}))
    :CATS.map(c=>({title:c.k,color:`var(${c.v})`,items:all.filter(t=>t.category===c.k).sort(byFloor),tag:t=>[t.shop,shortFloor(t.floor)].filter(Boolean).join(" · ")})).filter(g=>g.items.length);
  if(facs.length)groups.push({title:"Mall facilities",color:"var(--c-fac)",items:facs,tag:t=>[shortFloor(t.floor),t.shop].filter(Boolean).join(" · ")});
  const used=CATS.filter(c=>all.some(t=>t.category===c.k));const lg=imgUrl(CONFIG.logoUrl);
  const ncol=Math.max(1,Math.min(groups.reduce((s,g)=>s+g.items.length,0)>0?6:1,Math.floor((b.clientWidth||1100)/290)));
  const cols=packCols(groups,ncol);
  b.innerHTML=`<div class="board-head"><div class="bh-logo">${logoImg(CONFIG.companyLogoUrl,CONFIG.companyName)}</div>
      <div class="bh-title"><h2>${esc(CONFIG.mallName||"Mall Directory")}</h2><p>Karibu · Welcome · Tenant directory</p></div>
      <div class="bh-logo">${logoImg(CONFIG.logoUrl,CONFIG.mallName)}</div></div>
    <div class="board-cols" style="grid-template-columns:repeat(${cols.length||1},minmax(0,1fr))">${groups.length?cols.map(col=>`<div class="bcol">${col.map(g=>`<section class="bcat" style="--cat:${g.color}"><h3><i></i>${esc(g.title)}${g.cont?" <small>(continued)</small>":""}</h3>
      ${g.items.map(t=>`<div class="brow" style="--cat:var(${catOf(t.category).v})">${logoHTML(t,"mini")}<b>${esc(t.name)}${t.status==="Coming Soon"?' <small class="hint">(coming soon)</small>':""}</b><em>${esc(g.tag(t))}</em></div>`).join("")}
    </section>`).join("")}</div>`).join(""):`<div class="empty" style="margin:20px">${S.loaded?"No shops listed yet.":"Loading shops…"}</div>`}</div>
    ${S.group==="floor"&&used.length?`<div class="legend">${used.map(c=>`<span><i style="background:var(${c.v})"></i>${esc(c.k)}</span>`).join("")}</div>`:""}
    <div class="board-foot"><div class="scan"><div class="qr-box" id="qrBoard"></div><div><strong>Can't find it? Scan here</strong><div class="hint">Search every shop on your phone</div></div></div>
      <div class="hint">${all.length} shops</div></div>`;
  drawQR($("#qrBoard"),170);
  {const lg=imgUrl(CONFIG.logoUrl);b.style.background=(CONFIG.watermark!==false&&lg)?`linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.9)), url("${lg}") center 55%/min(55vw,640px) no-repeat fixed, #fff`:"";if(lg&&CONFIG.watermark!==false)b.classList.add("wm-board")}

}

window.addEventListener("hashchange",show);
staffInit();
show();
load().then(refresh);
if(CONFIG.sheetCsvUrl&&CONFIG.refreshMinutes>0)setInterval(()=>load().then(refresh),CONFIG.refreshMinutes*60000);
</script>
